<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>회원가입</title>
    <style>
        /* 기존 스타일 유지 */
    </style>
</head>
<body>
<h2>회원가입</h2>
<form th:action="@{/members/signup}" th:object="${memberJoinDto}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <div th:if="${error}" th:text="${error}" style="color: red;"></div>

    <div>
        <label for="name">이름:</label>
        <input type="text" id="name" th:field="*{name}" required>
    </div>
    <div>
        <label for="email">이메일:</label>
        <input type="email" id="email" th:field="*{email}" required>
    </div>
    <div>
        <label for="password">비밀번호:</label>
        <input type="password" id="password" th:field="*{password}" required>
    </div>
    <div>
        <label for="gender">성별:</label>
        <select id="gender" th:field="*{gender}">
            <option value="1">남성</option>
            <option value="2">여성</option>
            <option value="3">선택안함</option>
        </select>
    </div>
    <div>
        <label for="birthYear">출생날짜:</label>
        <input type="date" id="birthYear" th:field="*{birthday}" required>
    </div>
    <div>
        <label for="address">주소:</label>
        <input type="text" id="address" th:field="*{address}" required>
    </div>
    <div>
        <label for="specAddress">상세주소:</label>
        <input type="text" id="specAddress" th:field="*{specAddress}" required>
    </div>
    <div>
        <label>선호 카테고리:</label>
        <div class="preferCategory">
            <label><input type="checkbox" th:field="*{preferCategory}" value="1"> 한식</label>
            <label><input type="checkbox" th:field="*{preferCategory}" value="2"> 중식</label>
            <label><input type="checkbox" th:field="*{preferCategory}" value="3"> 일식</label>
        </div>
    </div>
    <div>
        <label><input type="checkbox" th:field="*{place_consent}"> 위치 정보 수집 동의</label>
    </div>
    <div>
        <label><input type="checkbox" th:field="*{marketing_consent}"> 마케팅 활용 동의</label>
    </div>

    <div>
        <label for="role">역할:</label>
        <select id="role" th:field="*{role}">
            <option value="USER">일반 사용자</option>
            <option value="ADMIN">관리자</option>
        </select>
    </div>
    <button type="submit">가입하기</button>
</form>
</body>
</html>
